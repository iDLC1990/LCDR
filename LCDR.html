<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCDR Hub</title>
<style>
:root{
  --side-w:230px; --side-w-min:56px; --top-h:44px;
  --side-bg:#1b2733; --side-hover:#26384a; --side-active:#2d8cc0; --side-sub:#15202a;
  --top-bg:#3a8fbf; --text:#e6eef5; --muted:#8fa5b8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0d141b;font-family:'Segoe UI',Tahoma,Arial,sans-serif;color:var(--text)}

#sidebar{
  position:fixed;left:0;top:0;bottom:0;width:var(--side-w);background:var(--side-bg);
  display:flex;flex-direction:column;z-index:50;transition:width .2s ease;overflow:hidden;
}
body.collapsed #sidebar{width:var(--side-w-min)}

.brand{height:var(--top-h);flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--top-bg);font-weight:800;font-size:20px;letter-spacing:.5px;color:#fff;white-space:nowrap}
.brand .short{display:none}
body.collapsed .brand .full{display:none}
body.collapsed .brand .short{display:inline}

#menu{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 0}
.item{display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 18px;border:0;background:none;
  color:var(--text);font:inherit;font-size:13px;text-align:left;cursor:pointer;white-space:nowrap;position:relative}
.item:hover{background:var(--side-hover)}
.item .ico{flex:none;width:20px;text-align:center;font-size:16px}
.item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis}
.item .arr{flex:none;font-size:10px;color:var(--muted);transition:transform .2s}
.group.open > .item .arr{transform:rotate(90deg)}
.item.active{background:var(--side-active);color:#fff}
.item:focus-visible{outline:2px solid #fff;outline-offset:-2px}

.sub{display:none;background:var(--side-sub)}
.group.open > .sub{display:block}
.sub .item{padding-left:50px;height:36px;font-size:12.5px;color:#c4d3e0}
.sub .item.active{color:#fff}

body.collapsed .item{padding:0;justify-content:center}
body.collapsed .item .lbl, body.collapsed .item .arr{display:none}
body.collapsed .sub{display:none !important}
body.collapsed .item[data-tip]:hover::after{
  content:attr(data-tip);position:fixed;left:calc(var(--side-w-min) + 6px);background:#0d141b;color:#fff;
  padding:6px 10px;border-radius:4px;font-size:12px;white-space:nowrap;border:1px solid #2c4152;z-index:100;
}

#main{position:fixed;left:var(--side-w);right:0;top:0;bottom:0;display:flex;flex-direction:column;transition:left .2s ease}
body.collapsed #main{left:var(--side-w-min)}

#topbar{flex:none;height:var(--top-h);background:var(--top-bg);display:flex;align-items:center;gap:14px;padding:0 14px}
#burger{width:34px;height:34px;border:0;border-radius:4px;background:rgba(255,255,255,.15);color:#fff;font-size:18px;cursor:pointer}
#burger:hover{background:rgba(255,255,255,.28)}
#burger:focus-visible{outline:2px solid #fff}
#pageTitle{font-size:15px;font-weight:600;color:#fff}

#tabs{flex:none;display:flex;gap:2px;background:#16212b;padding:4px 8px 0;overflow-x:auto;min-height:30px}
.tab{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:12px;color:var(--muted);background:#1f2d3a;
  border-radius:4px 4px 0 0;cursor:pointer;white-space:nowrap;border:0;font-family:inherit}
.tab.active{background:#fff;color:#111;font-weight:600}
.tab .x{font-size:13px;opacity:.6;padding:0 2px}
.tab .x:hover{opacity:1;color:#c0392b}

#frames{flex:1;position:relative;background:#fff}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
#frames iframe.show{display:block}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;background:#0d141b}

#scrim{display:none}
@media (max-width:800px){
  #sidebar{transform:translateX(-100%);width:var(--side-w) !important;transition:transform .2s ease}
  body.mobile-open #sidebar{transform:none}
  #main,body.collapsed #main{left:0}
  body.mobile-open #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
  body.collapsed .item{padding:0 18px;justify-content:flex-start}
  body.collapsed .item .lbl, body.collapsed .item .arr{display:inline}
  body.collapsed .brand .full{display:inline}
  body.collapsed .brand .short{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<nav id="sidebar" aria-label="Меню">
  <div class="brand"><span class="full">LCDR HUB</span><span class="short">LH</span></div>
  <div id="menu"></div>
</nav>
<div id="scrim"></div>

<div id="main">
  <header id="topbar">
    <button id="burger" aria-label="Свернуть или развернуть меню">☰</button>
    <span id="pageTitle"></span>
  </header>
  <div id="tabs" role="tablist"></div>
  <div id="frames"><div id="empty">Выберите раздел в меню</div></div>
</div>

<script>
/* ===== НАСТРОЙКА: сюда впишите имена файлов ваших сайтов ===== */
const MENU = [
  { id:'labels', title:'Друк етикеток',   icon:'🖨️', src:'labels.html' },
  { id:'lcdr',   title:'LCDR',            icon:'📊', children:[
      { id:'dashboard', title:'Live Data (дашборд)',   icon:'📟', src:'dashboard.html' },
      { id:'stats',     title:'Статистика по датам',   icon:'📈', src:'stats.html' }
  ]},
  { id:'parts',  title:'База деталей',    icon:'🗄️', src:'parts.html' }
];
/* ============================================================= */

const $ = s => document.querySelector(s);
const menuEl = $('#menu'), framesEl = $('#frames'), tabsEl = $('#tabs'), emptyEl = $('#empty');
const pages = {};            // id -> page
const opened = [];           // порядок открытых вкладок
let current = null;

function flat(list, parent){ list.forEach(p => { if(p.children) flat(p.children, p); else { p.parent = parent ? parent.id : null; pages[p.id] = p; } }); }
flat(MENU);

function mkItem(p, cls){
  const b = document.createElement('button');
  b.className = 'item' + (cls ? ' ' + cls : '');
  b.dataset.tip = p.title;
  b.innerHTML = `<span class="ico">${p.icon}</span><span class="lbl"></span>` + (p.children ? '<span class="arr">▶</span>' : '');
  b.querySelector('.lbl').textContent = p.title;
  return b;
}

MENU.forEach(p => {
  if(p.children){
    const g = document.createElement('div'); g.className = 'group'; g.id = 'g-' + p.id;
    const head = mkItem(p);
    head.onclick = () => {
      if(document.body.classList.contains('collapsed') && innerWidth > 800){ setCollapsed(false); g.classList.add('open'); }
      else g.classList.toggle('open');
    };
    const sub = document.createElement('div'); sub.className = 'sub';
    p.children.forEach(c => { const it = mkItem(c); it.id = 'm-' + c.id; it.onclick = () => openPage(c.id); sub.appendChild(it); });
    g.append(head, sub); menuEl.appendChild(g);
  } else {
    const it = mkItem(p); it.id = 'm-' + p.id; it.onclick = () => openPage(p.id); menuEl.appendChild(it);
  }
});

function renderTabs(){
  tabsEl.innerHTML = '';
  opened.forEach(id => {
    const p = pages[id];
    const t = document.createElement('div'); t.className = 'tab' + (id === current ? ' active' : ''); t.setAttribute('role','tab');
    const name = document.createElement('span'); name.textContent = p.title;
    const x = document.createElement('span'); x.className = 'x'; x.textContent = '×'; x.title = 'Закрыть';
    x.onclick = e => { e.stopPropagation(); closePage(id); };
    t.append(name, x); t.onclick = () => openPage(id); tabsEl.appendChild(t);
  });
}

function openPage(id){
  const p = pages[id]; if(!p) return;
  let fr = document.getElementById('f-' + id);
  if(!fr){
    fr = document.createElement('iframe');
    fr.id = 'f-' + id; fr.src = p.src; fr.title = p.title;
    fr.allow = 'clipboard-read; clipboard-write; fullscreen';
    framesEl.appendChild(fr);
    opened.push(id);
  }
  document.querySelectorAll('#frames iframe').forEach(f => f.classList.toggle('show', f === fr));
  emptyEl.style.display = 'none';
  current = id;
  document.querySelectorAll('.item.active').forEach(i => i.classList.remove('active'));
  const mi = document.getElementById('m-' + id); if(mi) mi.classList.add('active');
  if(p.parent) document.getElementById('g-' + p.parent).classList.add('open');
  $('#pageTitle').textContent = p.title;
  document.title = p.title + ' · LCDR Hub';
  history.replaceState(null, '', '#' + id);
  try{ localStorage.setItem('hubLast', id); }catch(e){}
  renderTabs();
  document.body.classList.remove('mobile-open');
  // фокус внутрь страницы, чтобы работали горячие клавиши (Alt+1/2/3, Ctrl+P)
  const focusIn = () => { try{ fr.contentWindow.focus(); }catch(e){} };
  focusIn(); fr.addEventListener('load', focusIn, { once:true });
}

function closePage(id){
  const fr = document.getElementById('f-' + id); if(fr) fr.remove();
  opened.splice(opened.indexOf(id), 1);
  if(current === id){
    current = null;
    if(opened.length) openPage(opened[opened.length - 1]);
    else {
      emptyEl.style.display = 'flex'; $('#pageTitle').textContent = ''; document.title = 'LCDR Hub';
      document.querySelectorAll('.item.active').forEach(i => i.classList.remove('active'));
      history.replaceState(null, '', location.pathname); renderTabs();
    }
  } else renderTabs();
}

function setCollapsed(v){
  document.body.classList.toggle('collapsed', v);
  try{ localStorage.setItem('hubCollapsed', v ? '1' : '0'); }catch(e){}
}
$('#burger').onclick = () => {
  if(innerWidth <= 800) document.body.classList.toggle('mobile-open');
  else setCollapsed(!document.body.classList.contains('collapsed'));
};
$('#scrim').onclick = () => document.body.classList.remove('mobile-open');

try{ if(localStorage.getItem('hubCollapsed') === '1') document.body.classList.add('collapsed'); }catch(e){}

window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if(pages[id] && id !== current) openPage(id); });

(function start(){
  let id = location.hash.slice(1);
  if(!pages[id]){ try{ id = localStorage.getItem('hubLast'); }catch(e){} }
  if(!pages[id]) id = Object.keys(pages)[0];
  openPage(id);
})();
</script>
</body>
</html>
