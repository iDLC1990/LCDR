<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LCDR</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app" id="app">

    <!-- Верхняя панель -->
    <header class="topbar">
      <div class="brand">LCDR</div>
      <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
      <div class="page-title" id="pageTitle">Print</div>
    </header>

    <!-- Боковое меню -->
    <aside class="sidebar" id="sidebar">
      <nav>
        <div class="nav-group">
          <button class="nav-item nav-parent">
            <span class="label" data-i18n="print">Print</span>
            <span class="arrow">▼</span>
          </button>
          <div class="submenu">
            <a href="#" class="nav-item sub" data-page="final1">
              <span class="label" data-i18n="final1">Final station I</span>
            </a>
            <a href="#" class="nav-item sub" data-page="final2">
              <span class="label" data-i18n="final2">Final station II</span>
            </a>
            <a href="#" class="nav-item sub" data-page="special">
              <span class="label" data-i18n="special">Special</span>
            </a>
            <a href="#" class="nav-item sub" data-page="label">
              <span class="label" data-i18n="label">Label</span>
            </a>
          </div>
        </div>

        <div class="nav-group">
          <button class="nav-item nav-parent">
            <span class="label" data-i18n="lcdr">LCDR</span>
            <span class="arrow">▼</span>
          </button>
          <div class="submenu">
            <a href="#" class="nav-item sub" data-page="live">
              <span class="label" data-i18n="live">Live Data</span>
            </a>
            <a href="#" class="nav-item sub" data-page="stats">
              <span class="label" data-i18n="stats">Statistic</span>
            </a>
          </div>
        </div>

        <a href="#" class="nav-item" data-page="parts">
          <span class="label" data-i18n="pnbase">PN Base</span>
        </a>
      </nav>
    </aside>

    <!-- Основная область -->
    <main class="main">
      <div class="tabs" id="tabs"></div>
      <section class="content" id="content"></section>
      <section class="label-page" id="labelPage" style="display:none"></section>
      <section class="label-page" id="pnbasePage" style="display:none"></section>
    </main>

  </div>

  <!-- Библиотека для штрихкодов (нужна Label и PN Base) -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/label.js"></script>
  <script src="js/pnbase.js"></script>
</body>
</html>
